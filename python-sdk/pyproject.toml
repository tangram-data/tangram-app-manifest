[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tangram-app-sdk"
version = "0.1.0rc3"
description = "Python SDK for building, validating, and running Tangram apps and connectors locally"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tangram" }]
keywords = ["tangram", "manifest", "agent", "sdk", "connector"]
dependencies = ["PyYAML>=6.0.2,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/tangram-data/tangram-app-manifest"
Documentation = "https://github.com/tangram-data/tangram-app-manifest/tree/main/python-sdk/docs"
Source = "https://github.com/tangram-data/tangram-app-manifest"
Issues = "https://github.com/tangram-data/tangram-app-manifest/issues"

[project.scripts]
tangram-app = "tangram_app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tangram_app"]
