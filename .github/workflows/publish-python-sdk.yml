name: Publish python-sdk to PyPI

on:
  push:
    tags:
      - "tangram-app-sdk@*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke tests (pkl-free subset)
        working-directory: python-sdk
        run: |
          python -m pip install --quiet pytest pyyaml
          PYTHONPATH=src python -m pytest \
            tests/test_backend_sdk_conformance.py \
            tests/test_local_actions.py \
            tests/test_local_notifications.py \
            tests/test_local_schedules.py \
            tests/test_local_oauth.py \
            tests/test_builder_skill.py -q
      - name: Verify tag matches package version
        working-directory: python-sdk
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "tangram-app-sdk@${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} != pyproject version ${version}"; exit 1; }
      - name: Build sdist and wheel
        run: pipx run build --sdist --wheel --outdir dist python-sdk
      - name: Check metadata
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (no stored secrets)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
