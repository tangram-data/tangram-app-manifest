plugins {
  id "org.pkl-lang" version "0.28.2"
}

def projectDirs = file("src")
def outputDir = file("build")

pkl {
  project {
    resolvers {
      register('resolveProjects') {
        projectDirectories.from(projectDirs)
      }
    }
    packagers {
      register('createPackage') {
        projectDirectories.from(projectDirs)
        outputPath.set(file('build/generated/packages/%{name}/%{version}'))

        // Set environment variables
        def maybeVersion = System.getenv("VERSION")
        if (maybeVersion != null) {
          environmentVariables.put("VERSION", maybeVersion)
        }
      }
    }
  }
  evaluators {
    // Renders the example `ui/components.pkl` the same way the platform loader
    // does (evaluate the `components` expression to JSON); fails on schema drift.
    register('evalUiComponentsExample') {
      sourceModules = [file('examples/ui-components/manifests/ui/components.pkl')]
      expression = 'new JsonRenderer { omitNullProperties = false }.renderValue(components)'
      outputFile = file('build/examples/ui-components.json')
    }
    // Renders the example built-app package manifest (the package.json shape
    // the tangram-os exporter emits); fails on app-package.pkl schema drift.
    // The schema itself travels as migrations/V{n}__migration.sql files
    // beside it — plain SQL, nothing to render.
    register('evalAppPackageExample') {
      sourceModules = [file('examples/app-package/feedback/package.pkl')]
      expression = 'new JsonRenderer { omitNullProperties = false }.renderValue(manifest)'
      outputFile = file('build/examples/app-package.json')
    }
    // Renders a representative OAuth-backed connector declaration. This
    // verifies that core connector auth and the standalone OAuth vocabulary
    // compose into the JSON shape consumed by the platform manifest loader.
    register('evalOAuthConnectorExample') {
      sourceModules = [file('examples/oauth-connector/manifests/api/spec.pkl')]
      expression = 'new JsonRenderer { omitNullProperties = false }.renderValue(Map("auth", auth, "oauth", oauth, "oauthWithDefaults", oauthWithDefaults, "tenantSources", tenantSources, "connectionScopes", connectionScopes))'
      outputFile = file('build/examples/oauth-connector.json')
    }
  }
}
